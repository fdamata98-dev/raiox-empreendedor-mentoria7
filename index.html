<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAIO-X DO EMPREENDEDOR | MENTORIA 7</title>
<style>
:root{--bg:#fff;--fg:#141414;--card:#f6f5f4;--mut:#6b6b6b;--line:#e2e0de;--red:#d90f1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#f3f1ef;--card:#1b1b1b;--mut:#a09d9a;--line:#333}}
:root[data-theme="dark"]{--bg:#111;--fg:#f3f1ef;--card:#1b1b1b;--mut:#a09d9a;--line:#333}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px 90px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.hin{max-width:720px;margin:0 auto;padding:10px 18px}
.brand{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.12em;font-weight:700;text-transform:uppercase}
.brand span:last-child{color:var(--mut)}
.bar{height:4px;background:var(--line);margin-top:8px;border-radius:2px}.bar i{display:block;height:100%;background:var(--red);border-radius:2px;transition:width .3s}
h1{font-size:clamp(34px,9vw,56px);line-height:1.02;margin:.2em 0;letter-spacing:-.02em;font-weight:800}
h2{font-size:26px;line-height:1.15;margin:.1em 0 .3em;letter-spacing:-.01em}
.kick{color:var(--red);font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.quote{border-left:4px solid var(--red);padding-left:14px;font-style:italic;font-size:19px;margin:18px 0}
.intro{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
label.q{display:block;font-weight:600;margin-bottom:8px}label.q b{color:var(--red);margin-right:6px}
textarea,input[type=text]{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:92px;resize:vertical}textarea:focus,input:focus{outline:2px solid var(--red);outline-offset:1px}
.btn{font:inherit;font-weight:700;letter-spacing:.04em;border:2px solid var(--fg);background:transparent;color:var(--fg);padding:12px 18px;border-radius:999px;cursor:pointer}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn:active{transform:scale(.98)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:22px;flex-wrap:wrap}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;cursor:pointer}
.opt b{display:block;letter-spacing:.06em}.opt span{color:var(--mut);font-size:14px}.opt.on{border-color:var(--red)}
.scale{display:flex;gap:8px;margin:10px 0}.scale button{flex:1;font:inherit;font-weight:800;font-size:18px;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:12px 0;cursor:pointer}
.scale button.on{background:var(--red);border-color:var(--red);color:#fff}
.leg{font-size:13px;color:var(--mut)}.err{color:var(--red);font-weight:600;margin-top:12px}
.dots{display:flex;gap:6px;margin:6px 0 14px}.dots i{width:100%;height:5px;border-radius:3px;background:var(--line)}.dots i.d{background:var(--fg)}.dots i.c{background:var(--red)}
.row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}.row em{flex:0 0 150px;font-style:normal}.row .t{flex:1;height:8px;background:var(--line);border-radius:4px}.row .t i{display:block;height:100%;background:var(--red);border-radius:4px}
.score{font-size:54px;font-weight:800;color:var(--red);line-height:1}
.small{font-size:13px;color:var(--mut)}.sum h3{margin:16px 0 2px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}.sum p{margin:0;white-space:pre-wrap}
.sign{border-top:2px solid var(--red);margin-top:22px;padding-top:12px}
@media (max-width:520px){.row em{flex-basis:105px}}
@media print{:root{--bg:#fff;--fg:#111;--card:#fff;--mut:#555;--line:#ccc}header,.noprint{display:none!important}.wrap{padding:0}.card{break-inside:avoid}}
</style>
</head>
<body>
<header id="hd" class="noprint"><div class="hin"><div class="brand"><span>Raio-X do Empreendedor</span><span id="st"></span></div><div class="bar"><i id="pb" style="width:0"></i></div></div></header>
<main class="wrap" id="app"></main>
<script>
var D=[
["Mentalidade empreendedora","Como penso, decido e reajo perante desafios.","Esta dimensão procura compreender como pensas, decides e reages perante oportunidades, dificuldades e incertezas.",["O que significa empreender para ti?","Porque queres empreender ou porque decidiste empreender?","O que mais te motiva nesta jornada?","Como reages quando uma ideia não funciona?","Tens facilidade em assumir riscos calculados?","Costumas transformar ideias em acções ou ficas frequentemente na fase de planeamento?"]],
["Autoconhecimento","Conheço as minhas forças e limitações.","Conhecer as tuas forças e limitações é fundamental para saber onde podes destacar-te e onde precisas de crescer.",["Quais consideras serem as tuas três maiores qualidades?","Quais são as tuas três maiores limitações?","Em que actividades sentes que tens mais facilidade?","Que competências acreditas que te diferenciam?","O que precisas de aprender para avançar?"]],
["Visão e oportunidades","Consigo identificar problemas e oportunidades.","Empreender também significa aprender a observar o mundo, identificar problemas e reconhecer oportunidades de criar valor.",["Que problemas existentes na tua comunidade ou sociedade gostarias de resolver?","Que oportunidades de negócio consegues identificar à tua volta?","Tens alguma ideia que gostarias de transformar num negócio?","Consegues identificar quem beneficiaria dessa solução?","Como imaginas a tua vida profissional e empresarial daqui a cinco anos?"]],
["Capacidade de execução","Transformo ideias e objectivos em acções.","Uma ideia só começa a ganhar forma quando é transformada em acções.",["Costumas estabelecer objectivos e trabalhar para os alcançar?","Consegues organizar o teu tempo e prioridades?","Quando tens uma tarefa importante, consegues concluí-la?","Como lidas com a falta de recursos?","Já começaste algum projecto e não conseguiste terminar? Porquê?"]],
["Recursos e preparação","Reconheço e mobilizo os recursos disponíveis.","Capital não é o único recurso disponível para empreender. Conhecimentos, competências, tempo, contactos, experiência e capacidade de aprender também são recursos.",["Que conhecimentos e competências já possuis?","Tens uma rede de contactos que pode ajudar no teu percurso?","Quanto tempo consegues dedicar ao teu desenvolvimento empreendedor?","Que recursos tens actualmente ao teu dispor?","O que consideras ser a tua maior limitação neste momento?"]],
["Compromisso e crescimento","Tenho disciplina e abertura para aprender.","O desenvolvimento empreendedor exige aprendizagem, disciplina, abertura à mudança e compromisso com a execução.",["O que gostarias de alcançar nos próximos 12 meses?","Que hábito precisas de mudar para avançar?","Estás disposto a testar ideias, receber críticas e corrigir erros?","Qual é a principal mudança que precisas de fazer em ti para avançar?"]]];
var P=[["ASPIRANTE","Tenho vontade de empreender, mas ainda não tenho uma ideia definida."],["IDEALIZADOR","Tenho uma ideia ou projecto, mas ainda não comecei."],["EMPREENDEDOR EM ACTIVIDADE","Já comecei a vender ou prestar serviços."],["EMPRESÁRIO EM CRESCIMENTO","Já tenho um negócio e quero melhorá-lo ou expandi-lo."]];
var SC=["Preciso de desenvolver muito","Ainda tenho dificuldades","Estou num nível intermédio","Tenho uma boa capacidade","É uma das minhas principais forças"];
var RF=[["forca","A minha maior força como empreendedor é…"],["comp","A competência que mais preciso de desenvolver é…"],["limit","A minha maior limitação actualmente é…"],["oport","A oportunidade que gostaria de explorar é…"],["obst","O principal obstáculo que me impede de avançar é…"],["mud","A mudança que preciso de fazer em mim é…"]];
var DF=[["ponto","O meu ponto de partida é…"],["actual","Actualmente, considero que sou…"],["forcas","As minhas principais forças são…"],["desenv","Preciso de desenvolver…"],["desafio","O meu maior desafio é…"],["aprender","Durante a MENTORIA 7 quero aprender…"],["comp30","Nos próximos 30 dias comprometo-me a…"]];
var KEY="raiox_m7_001",N=11,S=blank();
function blank(){return{step:0,nome:"",pref:"",perfil:-1,area:"",a:{},r:{},rw:{},ref:{},dec:{},decl:"",declEd:false,share:"",shareEd:false}}
try{var sv=localStorage.getItem(KEY);if(sv)S=Object.assign(blank(),JSON.parse(sv))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function g(k){var p=k.split(".");return p.length>1?(S[p[0]]||{})[p[1]]:S[k]}
function set(k,v){var p=k.split(".");if(p.length>1){S[p[0]]=S[p[0]]||{};S[p[0]][p[1]]=v}else S[k]=v}
function ta(k,ph){return'<textarea data-k="'+k+'" placeholder="'+(ph||"Escreve aqui…")+'">'+esc(g(k))+'</textarea>'}
function total(){var t=0;for(var i=0;i<6;i++)t+=S.r[i]||0;return t}
function nm(){return S.pref||S.nome||"[Nome]"}
function v(x,f){return(x&&x.trim())||f}
function mkDecl(){var d=S.dec,f="[…]";return"Sou "+nm()+", actualmente encontro-me na fase "+(S.perfil>=0?P[S.perfil][0]:f)+". Reconheço que as minhas principais forças são "+v(d.forcas,v(S.ref.forca,f))+". Preciso de desenvolver "+v(d.desenv,v(S.ref.comp,f))+". O meu maior desafio neste momento é "+v(d.desafio,v(S.ref.obst,f))+". Durante a MENTORIA 7 quero "+v(d.aprender,f)+" e comprometo-me a "+v(d.comp30,f)+"."}
function mkShare(){var r=function(i){return(S.r[i]||"–")+"/5"},d=S.dec;
return"🔎 RAIO-X DO EMPREENDEDOR | MENTORIA 7\n\n👤 Nome: "+nm()+"\n\n🚀 Perfil: "+(S.perfil>=0?P[S.perfil][0]:"–")+"\n\n📊 Autoavaliação:\n- Mentalidade: "+r(0)+"\n- Autoconhecimento: "+r(1)+"\n- Visão e oportunidades: "+r(2)+"\n- Capacidade de execução: "+r(3)+"\n- Recursos e preparação: "+r(4)+"\n- Compromisso e crescimento: "+r(5)+"\n\n💪 A minha maior força:\n"+v(d.forcas,v(S.ref.forca,"–"))+"\n\n📚 O que preciso de desenvolver:\n"+v(d.desenv,v(S.ref.comp,"–"))+"\n\n🎯 O meu maior desafio:\n"+v(d.desafio,v(S.ref.obst,"–"))+"\n\n💡 O que quero alcançar na MENTORIA 7:\n"+v(d.aprender,"–")+"\n\n🔥 O meu compromisso para os próximos 30 dias:\n"+v(d.comp30,"–")}
function nav(last){return'<div class="nav noprint"><button class="btn" data-act="back">← VOLTAR</button><button class="btn red" data-act="next">'+(last||"CONTINUAR →")+'</button></div><p class="small noprint" style="margin-top:14px">As tuas respostas ficam guardadas apenas neste dispositivo.</p>'}
function dots(){var h='<div class="dots">';for(var i=0;i<6;i++){var any=S.step>=2+i+1||Object.keys(S.a).some(function(k){return D[i][4]&&qDim(+k)===i&&S.a[k]&&S.a[k].trim()});h+='<i class="'+(S.step===2+i?"c":any?"d":"")+'"></i>'}return h+'</div>'}
function qDim(n){var c=0;for(var i=0;i<6;i++){c+=D[i][3].length;if(n<=c)return i}return 5}
var err="";
function view(){var h="",s=S.step;
if(s===0){return'<div class="kick" style="margin-top:30px">MENTORIA 7 | Edição 001 | Dia 01</div><h1>RAIO-X DO<br><span style="color:var(--red)">EMPREENDEDOR</span></h1><div class="quote">Antes de construir um negócio, precisamos de compreender quem o quer construir.</div><p>Empreender começa muito antes de abrir uma empresa, vender um produto ou investir dinheiro. Começa com a pessoa que decide dar o primeiro passo.</p><p>Este exercício foi criado para te ajudar a compreender quem és enquanto empreendedor, onde te encontras actualmente, quais são as tuas forças e o que precisas de desenvolver para avançar.</p><p><b>Não existem respostas certas ou erradas.</b> O mais importante é responderes com honestidade.</p><div class="nav"><button class="btn red" data-act="next">COMEÇAR O MEU DIAGNÓSTICO</button></div>'+(S.nome||Object.keys(S.a).length?'<p class="small">Tens um exercício em curso neste dispositivo. <a href="#" data-act="reset" style="color:var(--red)">Apagar e recomeçar</a></p>':'')}
if(s===1){h='<div class="kick">Etapa inicial</div><h2>Quem és tu?</h2><p class="intro">Começamos pelo básico. Só o nome e o perfil são obrigatórios.</p><label class="q">Nome completo <b>*</b></label><input type="text" data-k="nome" value="'+esc(S.nome)+'" autocomplete="name"><label class="q" style="margin-top:14px">Nome que preferes utilizar na comunidade (opcional)</label><input type="text" data-k="pref" value="'+esc(S.pref)+'"><label class="q" style="margin-top:14px">Área de interesse ou sector de actividade (opcional)</label><input type="text" data-k="area" value="'+esc(S.area)+'"><label class="q" style="margin-top:18px">Perfil actual <b>*</b></label>';
P.forEach(function(p,i){h+='<button class="opt'+(S.perfil===i?" on":"")+'" data-act="perfil" data-v="'+i+'"><b>'+(i+1)+'. '+p[0]+'</b><span>'+p[1]+'</span></button>'});
return h+(err?'<div class="err">'+err+'</div>':'')+nav()}
if(s>=2&&s<=7){var i=s-2,d=D[i],n0=0;for(var j=0;j<i;j++)n0+=D[j][3].length;
h=dots()+'<div class="kick">Dimensão '+(i+1)+' de 6</div><h2>'+d[0]+'</h2><p class="intro">'+d[2]+'</p>';
d[3].forEach(function(q,k){var n=n0+k+1;h+='<div class="card"><label class="q"><b>'+n+'.</b>'+q+'</label>'+ta("a."+n)+'</div>'});return h+nav()}
if(s===8){h='<div class="kick">Autoavaliação</div><h2>Como te vês em cada dimensão?</h2><p class="intro">Escolhe uma nota de 1 a 5. Não é um teste: é um espelho.</p>';
D.forEach(function(d,i){var r=S.r[i];h+='<div class="card"><div class="small">Dimensão '+(i+1)+' de 6</div><label class="q" style="margin:2px 0">'+d[0]+'</label><div class="small">'+d[1]+'</div><div class="scale">';for(var k=1;k<=5;k++)h+='<button data-act="score" data-d="'+i+'" data-v="'+k+'" class="'+(r===k?"on":"")+'">'+k+'</button>';
h+='</div><div class="leg">'+(r?r+" — "+SC[r-1]:"1 — "+SC[0]+" · 5 — "+SC[4])+'</div><label class="q" style="margin:12px 0 6px;font-weight:500">Porque atribuí esta pontuação? (opcional)</label>'+ta("rw."+i)+'</div>'});
return h+'<div class="card"><div class="small">Pontuação total (reflexão, não classificação)</div><div class="score">'+total()+'<span style="font-size:20px;color:var(--mut)"> / 30</span></div></div>'+(err?'<div class="err">'+err+'</div>':'')+nav()}
if(s===9){h='<div class="kick">Reflexão</div><h2>O que descobri sobre mim?</h2><p class="intro">Olha para as tuas respostas e notas. O que ressalta?</p>';RF.forEach(function(f){h+='<div class="card"><label class="q">'+f[1]+'</label>'+ta("ref."+f[0])+'</div>'});return h+nav()}
if(s===10){if(!S.declEd)S.decl=mkDecl();h='<div class="kick">Declaração</div><h2>A tua declaração de empreendedor</h2><p class="intro">Completa os campos. A declaração constrói-se sozinha, e podes editá-la.</p>';DF.forEach(function(f){h+='<div class="card"><label class="q">'+f[1]+'</label>'+ta("dec."+f[0])+'</div>'});
return h+'<div class="card" style="border-color:var(--red)"><label class="q">A minha declaração (editável)</label><textarea data-k="decl" style="min-height:190px">'+esc(S.decl)+'</textarea><p class="small">Se a editares, deixa de ser actualizada automaticamente. <a href="#" data-act="regen" style="color:var(--red)">Gerar de novo</a></p></div>'+nav("CONCLUIR →")}
if(s===11){var sm=function(t,x){return'<h3>'+t+'</h3><p>'+esc(v(x,"–"))+'</p>'};
h='<div class="kick">Diagnóstico concluído</div><h1 style="font-size:clamp(30px,8vw,46px)">DIAGNÓSTICO CONCLUÍDO</h1><p>Parabéns por dedicares este tempo a compreender melhor quem és e onde te encontras na tua jornada empreendedora.</p><p>O autoconhecimento não resolve todos os desafios, mas permite-nos começar com maior clareza.</p><div class="card sum"><h3 style="margin-top:0">Nome</h3><p>'+esc(S.nome)+(S.pref?' ('+esc(S.pref)+')':'')+'</p><h3>Perfil empreendedor</h3><p>'+(S.perfil>=0?P[S.perfil][0]:"–")+'</p><h3>Pontuação global</h3><div class="score">'+total()+'<span style="font-size:18px;color:var(--mut)"> / 30</span></div><h3>As seis dimensões</h3>';
D.forEach(function(d,i){h+='<div class="row"><em>'+d[0]+'</em><div class="t"><i style="width:'+(S.r[i]||0)*20+'%"></i></div><b>'+(S.r[i]||"–")+'/5</b></div>'});
h+=sm("Principais forças",S.dec.forcas||S.ref.forca)+sm("Principais limitações",S.ref.limit)+sm("Principal desafio",S.dec.desafio||S.ref.obst)+sm("Objectivo na MENTORIA 7",S.dec.aprender)+sm("Compromisso para os próximos 30 dias",S.dec.comp30)+sm("Declaração pessoal",S.decl)+'<div class="sign"><b>O teu ponto de partida não determina onde podes chegar. Mas compreender onde estás pode ajudar-te a decidir o próximo passo.</b><p style="margin-top:10px">Francisco D’Mata<br>Mentor de Negócios<br><span class="small">MENTORIA 7 — 7 dias. Um mentor. Novas perspectivas.</span></p></div></div>';
h+='<div class="noprint"><div class="card"><label class="q">Resumo para o grupo (edita e remove o que não queres partilhar)</label><textarea id="sh" data-k="share" style="min-height:300px">'+esc(S.share)+'</textarea><div class="nav"><button class="btn red" data-act="copy" style="width:100%">COPIAR O MEU RESUMO PARA PARTILHAR</button></div><div id="msg" class="small" style="margin-top:8px"></div></div><div class="nav"><button class="btn" data-act="copy">COPIAR RESUMO</button><button class="btn" data-act="print">DESCARREGAR PDF</button><button class="btn" data-act="print">IMPRIMIR</button></div><div class="nav"><button class="btn" data-act="edit">EDITAR RESPOSTAS</button><button class="btn" data-act="reset">REINICIAR EXERCÍCIO</button></div><p class="small" style="margin-top:14px">Para PDF, escolhe «Guardar como PDF» na janela de impressão. <a href="#" data-act="reset" style="color:var(--red)">Apagar todos os dados deste dispositivo</a>.</p></div>';return h}}
function render(){var s=S.step;document.getElementById("hd").style.display=s===0?"none":"";document.getElementById("pb").style.width=(s/N*100)+"%";document.getElementById("st").textContent=s?"Etapa "+s+" de "+N:"";document.getElementById("app").innerHTML=view();window.scrollTo(0,0);save()}
function go(d){err="";var s=S.step;
if(d>0){if(s===1&&(!S.nome.trim()||S.perfil<0)){err="Preenche o teu nome e escolhe o teu perfil para continuar.";return render()}
if(s===8&&total()===0||s===8&&[0,1,2,3,4,5].some(function(i){return!S.r[i]})){err="Falta atribuir uma nota a todas as dimensões. Escolhe a que sentes mais próxima.";return render()}
if(s===10&&!S.declEd)S.decl=mkDecl();if(s===10&&!S.shareEd)S.share=mkShare()}
S.step=Math.max(0,Math.min(N,s+d));if(S.step===11&&!S.shareEd)S.share=mkShare();render()}
function copy(){var t=document.getElementById("sh"),txt=t?t.value:S.share,m=document.getElementById("msg");
function ok(){if(m)m.textContent="Resumo copiado. Já podes colar no WhatsApp."}
function fb(){try{t.select();document.execCommand("copy");ok()}catch(e){if(m)m.textContent="Não foi possível copiar automaticamente. Selecciona o texto e copia manualmente."}}
try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(e){fb()}}
var app=document.getElementById("app");
app.addEventListener("input",function(e){var k=e.target.dataset.k;if(!k)return;set(k,e.target.value);
if(k==="decl")S.declEd=true;if(k==="share")S.shareEd=true;
if(k.indexOf("dec.")===0&&!S.declEd){S.decl=mkDecl();var x=app.querySelector('[data-k="decl"]');if(x)x.value=S.decl}save()});
app.addEventListener("click",function(e){var b=e.target.closest("[data-act]");if(!b)return;e.preventDefault();var a=b.dataset.act;
if(a==="next")go(1);else if(a==="back")go(-1);
else if(a==="perfil"){S.perfil=+b.dataset.v;err="";render()}
else if(a==="score"){S.r[b.dataset.d]=+b.dataset.v;err="";var y=window.scrollY;render();window.scrollTo(0,y)}
else if(a==="regen"){S.declEd=false;S.decl=mkDecl();render()}
else if(a==="copy")copy();
else if(a==="print"){try{window.print()}catch(x){}}
else if(a==="edit"){S.step=1;S.shareEd=false;render()}
else if(a==="reset"){if(confirm("Isto apaga todas as respostas deste dispositivo. Continuar?")){S=blank();try{localStorage.removeItem(KEY)}catch(x){}render()}}});
render();
</script>
</body>
</html>
